replicaCount: 1

fullnameOverride: "20260903"

image:
  repository: 878915883825.dkr.ecr.ca-central-1.amazonaws.com/20260903
  tag: "0cd8557a393ddb769c133662cd48ea31eb7fe047"
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  enabled: true
  name: users-api
  type: ClusterIP
  port: 8001
  targetPort: http

env:
  - name: SERVER_PORT
    value: "8001"
  - name: SPRING_PROFILES_ACTIVE
    value: "local"
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

startupProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 30
  successThreshold: 1

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
