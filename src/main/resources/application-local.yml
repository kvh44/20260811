spring:
  datasource:
    url: ${LOCAL_DB_URL:jdbc:mysql://localhost:3306/appdb}
    username: ${LOCAL_DB_USERNAME:appuser}
    password: ${LOCAL_DB_PASSWORD:apppassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 3000
