spring:
  main:
    lazy-initialization: true
  cache:
    type: redis
  datasource:
    url: ${LOCAL_DB_URL:jdbc:mysql://localhost:3306/appdb}
    username: ${LOCAL_DB_USERNAME:appuser}
    password: ${LOCAL_DB_PASSWORD:apppassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 3000
  mongodb:
    uri: ${LOCAL_MONGO_URI:mongodb://root:rootpassword@localhost:27017/appdb?authSource=admin}
  data:
    redis:
      host: ${LOCAL_REDIS_HOST:localhost}
      port: ${LOCAL_REDIS_PORT:6379}
      password: ${LOCAL_REDIS_PASSWORD:}
      database: ${LOCAL_REDIS_DATABASE:0}
      timeout: ${LOCAL_REDIS_READ_TIMEOUT:2s}
      connect-timeout: ${LOCAL_REDIS_CONNECT_TIMEOUT:2s}
  kafka:
    bootstrap-servers: ${LOCAL_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${LOCAL_KAFKA_CONSUMER_GROUP_ID:local-consumer-group}
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
