name: Deploy Helm to AWS EKS

on:
  push:
    branches:
      - main
    paths-ignore:
      - helm/20260819/values.yaml

permissions:
  id-token: write
  contents: write

concurrency:
  group: eks-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Configure AWS Credentials
        # AWS_ROLE_TO_ASSUME should be the ARN of the IAM role that GitHub OIDC will assume,
        # for example: arn:aws:iam::123456789012:role/ci-cd-github-oidc-role
        # Store that ARN in the repository or organization variables as AWS_ROLE_TO_ASSUME.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5.1.0
        with:
          version: v1.36.3

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.2.4

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Update Helm image tag for Argo CD
        env:
          IMAGE_TAG: ${{ github.sha }}
          VALUES_FILE: helm/20260819/values.yaml
        run: |
          sed -i -E "s|^  tag:.*|  tag: \"${IMAGE_TAG}\"|" "${VALUES_FILE}"

          if git diff --quiet -- "${VALUES_FILE}"; then
            echo "Helm image tag is already ${IMAGE_TAG}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "bryant.qin@gmail.com"
          # timestamp in yyyymmddHHMMSS
          TIMESTAMP="$(date +%Y%m%d%H%M%S)"
          git add -- "${VALUES_FILE}"
          git commit -m "#${TIMESTAMP}: deploy EKS image ${IMAGE_TAG}"
          git pull --rebase origin main
          git push

#      - name: Bootstrap Argo CD on EKS
#        env:
#          AWS_REGION: ${{ vars.AWS_REGION }}
#          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
#          ARGOCD_CHART_VERSION: "10.2.1"
