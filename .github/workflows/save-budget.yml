name: Apply AWS budget schedule

on:
  schedule:
    # GitHub cron uses UTC. Run hourly and calculate the action in Toronto time
    # so the 08:00-20:00 window continues to work across DST changes.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: save-aws-budget
  cancel-in-progress: false

jobs:
  apply-budget-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Select budget action
        id: budget-window
        shell: bash
        run: |
          hour="$(TZ=America/Toronto date +%H)"

          if ((10#${hour} >= 8 && 10#${hour} < 20)); then
            action="open"
          else
            action="close"
          fi

          echo "Toronto hour: ${hour}; action: ${action}"
          echo "action=${action}" >> "${GITHUB_OUTPUT}"

      - name: Scale ECS and EKS workloads
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_PROFILE: "default"
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          K8S_DEPLOYMENT: ${{ vars.K8S_DEPLOYMENT }}
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          SAVE_BUDGET_CONFIG_FILE: /dev/null
        run: |
          chmod +x ./save-budget.sh
          ./save-budget.sh "${{ steps.budget-window.outputs.action }}"
