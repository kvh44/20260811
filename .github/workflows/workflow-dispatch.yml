name: Input parameters for workflow dispatch

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: choice
        options:
          - local
          - production
      deployECS:
        description: "Deploy ECS?"
        required: true
        type: boolean
        default: true
      deployEKS:
        description: "Deploy EKS?"
        required: true
        type: boolean
        default: true
      deployHELM:
        description: "Deploy HELM?"
        required: true
        type: boolean
        default: true
jobs:
  deploy_ecs:
    if: inputs.deployECS == true
    uses: ./.github/workflows/ecs-deploy.yml
    with:
      deploy: ${{ inputs.deployECS }}
      environment: ${{ inputs.environment }}
    secrets: inherit
  deploy_eks:
    if: inputs.deployEKS == true
    uses: ./.github/workflows/eks-deploy.yml
    with:
      deploy: ${{ inputs.deployEKS }}
    secrets: inherit
  deploy_helm:
    if: inputs.deployHELM == true
    uses: ./.github/workflows/eks-helm-deploy.yml
    with:
      deploy: ${{ inputs.deployHELM }}
    secrets: inherit
