name: Terraform infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation to run.
        required: true
        default: plan
        type: choice
        options:
          - init
          - plan
          - apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-infrastructure
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ inputs.operation }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .terraform
    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActionsTerraform

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Import existing Terraform-managed AWS resources
        shell: bash
        run: |
          oidc_provider_address="aws_iam_openid_connect_provider.github_actions"
          eks_cluster_name="eks-cluster-20260903"
          eks_log_group_address="aws_cloudwatch_log_group.eks_cluster"
          eks_log_group_name="/aws/eks/${eks_cluster_name}/cluster"

          import_iam_role() {
            local address="$1"
            local name="$2"

            if ! terraform state list | grep -Fxq "${address}"; then
              if aws iam get-role --role-name "${name}" >/dev/null 2>&1; then
                terraform import -input=false "${address}" "${name}"
              fi
            fi
          }

          import_resource() {
            local address="$1"
            local id="$2"

            if ! terraform state list | grep -Fxq "${address}"; then
              terraform import -input=false "${address}" "${id}"
            fi
          }

          if ! terraform state list | grep -Fxq "${oidc_provider_address}"; then
            oidc_provider_arn="$(aws iam list-open-id-connect-providers \
              --query "OpenIDConnectProviderList[?contains(Arn, 'token.actions.githubusercontent.com')].Arn | [0]" \
              --output text)"

            if [[ -n "${oidc_provider_arn}" && "${oidc_provider_arn}" != "None" ]]; then
              terraform import -input=false "${oidc_provider_address}" "${oidc_provider_arn}"
            fi
          fi

          import_iam_role "aws_iam_role.github_actions_terraform" "GitHubActionsTerraform-20260903"
          import_iam_role "aws_iam_role.github_actions_eks" "GitHubActionsEKSDeploy-20260903"
          import_iam_role "aws_iam_role.eks_cluster" "eks-20260901-cluster"
          import_iam_role "aws_iam_role.eks_node" "eks-20260901-node"

          eks_vpc_id="$(aws eks describe-cluster \
            --cluster-name "${eks_cluster_name}" \
            --query 'cluster.resourcesVpcConfig.vpcId' \
            --output text 2>/dev/null || true)"

          if [[ -n "${eks_vpc_id}" && "${eks_vpc_id}" != "None" ]]; then
            import_resource "aws_vpc.eks" "${eks_vpc_id}"
            import_resource "aws_eks_cluster.this" "${eks_cluster_name}"

            read -r -a eks_private_subnet_ids <<< "$(aws ec2 describe-subnets \
              --filters \
                "Name=vpc-id,Values=${eks_vpc_id}" \
                "Name=tag:kubernetes.io/role/internal-elb,Values=1" \
              --query 'sort_by(Subnets, &AvailabilityZone)[].SubnetId' \
              --output text)"

            for index in "${!eks_private_subnet_ids[@]}"; do
              import_resource \
                "aws_subnet.eks_private[${index}]" \
                "${eks_private_subnet_ids[${index}]}"
            done
          fi

          terraform_role_arn="$(aws iam get-role \
            --role-name "GitHubActionsTerraform-20260903" \
            --query 'Role.Arn' \
            --output text)"
          terraform_access_entry_address="aws_eks_access_entry.github_actions_terraform"
          terraform_access_entry_id="${eks_cluster_name}:${terraform_role_arn}"
          terraform_access_policy_address="aws_eks_access_policy_association.github_actions_terraform_cluster_admin"
          terraform_access_policy_arn="arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"

          if ! terraform state list | grep -Fxq "${terraform_access_entry_address}"; then
            if aws eks describe-access-entry \
              --cluster-name "${eks_cluster_name}" \
              --principal-arn "${terraform_role_arn}" >/dev/null 2>&1; then
              terraform import -input=false \
                "${terraform_access_entry_address}" \
                "${terraform_access_entry_id}"
            fi
          fi

          if ! terraform state list | grep -Fxq "${terraform_access_policy_address}"; then
            existing_access_policy="$(aws eks list-associated-access-policies \
              --cluster-name "${eks_cluster_name}" \
              --principal-arn "${terraform_role_arn}" \
              --query "associatedAccessPolicies[?policyArn=='${terraform_access_policy_arn}'].policyArn | [0]" \
              --output text)"

            if [[ "${existing_access_policy}" == "${terraform_access_policy_arn}" ]]; then
              terraform import -input=false \
                "${terraform_access_policy_address}" \
                "${eks_cluster_name}#${terraform_role_arn}#${terraform_access_policy_arn}"
            fi
          fi

          if ! terraform state list | grep -Fxq "${eks_log_group_address}"; then
            existing_log_group="$(aws logs describe-log-groups \
              --log-group-name-prefix "${eks_log_group_name}" \
              --query "logGroups[?logGroupName=='${eks_log_group_name}'].logGroupName | [0]" \
              --output text)"

            if [[ "${existing_log_group}" == "${eks_log_group_name}" ]]; then
              terraform import -input=false "${eks_log_group_address}" "${eks_log_group_name}"
            fi
          fi

      - name: Terraform plan
        if: ${{ inputs.operation == 'plan' }}
        run: |
          terraform plan -input=false -lock-timeout=5m \
            -target=aws_route_table_association.eks_public \
            -target=aws_route_table_association.eks_private \
            -target=aws_eks_node_group.default \
            -target=aws_eks_addon.vpc_cni \
            -target=aws_eks_addon.coredns \
            -target=aws_eks_addon.kube_proxy \
            -target=aws_eks_access_policy_association.github_actions_terraform_cluster_admin \
            -out=tfplan

      - name: Remove failed EKS node group
        if: ${{ inputs.operation == 'apply' }}
        shell: bash
        run: |
          eks_cluster_name="eks-cluster-20260903"
          node_group_name="eks-20260901-default"
          node_group_status="$(aws eks describe-nodegroup \
            --region "${{ vars.AWS_REGION }}" \
            --cluster-name "${eks_cluster_name}" \
            --nodegroup-name "${node_group_name}" \
            --query 'nodegroup.status' \
            --output text 2>/dev/null || true)"

          if [[ "${node_group_status}" == "CREATE_FAILED" ]]; then
            echo "Deleting failed node group ${node_group_name}..."
            aws eks delete-nodegroup \
              --region "${{ vars.AWS_REGION }}" \
              --cluster-name "${eks_cluster_name}" \
              --nodegroup-name "${node_group_name}"
            aws eks wait nodegroup-deleted \
              --region "${{ vars.AWS_REGION }}" \
              --cluster-name "${eks_cluster_name}" \
              --nodegroup-name "${node_group_name}"
          else
            echo "No failed node group to delete (status: ${node_group_status:-not found})."
          fi

      - name: Terraform apply EKS foundation
        if: ${{ inputs.operation == 'apply' }}
        run: |
          terraform plan -input=false -lock-timeout=5m \
            -target=aws_route_table_association.eks_public \
            -target=aws_route_table_association.eks_private \
            -target=aws_eks_node_group.default \
            -target=aws_eks_addon.vpc_cni \
            -target=aws_eks_addon.coredns \
            -target=aws_eks_addon.kube_proxy \
            -target=aws_eks_access_policy_association.github_actions_terraform_cluster_admin \
            -out=tfplan-foundation
          terraform apply -input=false -auto-approve tfplan-foundation

      - name: Configure kubeconfig for Helm
        if: ${{ inputs.operation == 'apply' }}
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Terraform install Argo CD
        if: ${{ inputs.operation == 'apply' }}
        run: |
          terraform plan -input=false -lock-timeout=5m -out=tfplan-argocd
          terraform apply -input=false -auto-approve tfplan-argocd
