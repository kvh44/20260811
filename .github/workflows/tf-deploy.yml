name: Terraform infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation to run.
        required: true
        default: plan
        type: choice
        options:
          - init
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-infrastructure
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ inputs.operation }}
    if: ${{ inputs.operation != 'destroy' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .terraform
    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActionsTerraform

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Initialize Terraform state bucket
        id: terraform_state
        shell: bash
        run: |
          aws_account_id="$(aws sts get-caller-identity --query 'Account' --output text)"
          state_bucket="20260811-${aws_account_id}-${{ vars.AWS_REGION }}-terraform-state"

          if ! aws s3api head-bucket --bucket "${state_bucket}" 2>/dev/null; then
            if [[ "${{ inputs.operation }}" == "destroy" ]]; then
              echo "Terraform state bucket does not exist: ${state_bucket}" >&2
              exit 1
            fi

            aws s3api create-bucket \
              --bucket "${state_bucket}" \
              --region "${{ vars.AWS_REGION }}" \
              --create-bucket-configuration "LocationConstraint=${{ vars.AWS_REGION }}"
          fi

          aws s3api put-bucket-versioning \
            --bucket "${state_bucket}" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption \
            --bucket "${state_bucket}" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-public-access-block \
            --bucket "${state_bucket}" \
            --public-access-block-configuration 'BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true'

          echo "bucket=${state_bucket}" >> "${GITHUB_OUTPUT}"

      - name: Terraform init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ steps.terraform_state.outputs.bucket }}" \
            -backend-config="key=terraform/20260811.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Import existing Terraform-managed AWS resources
        if: ${{ inputs.operation != 'destroy' }}
        shell: bash
        run: |
          oidc_provider_address="aws_iam_openid_connect_provider.github_actions"
          eks_cluster_name="eks-cluster-20260903"
          eks_log_group_address="aws_cloudwatch_log_group.eks_cluster"
          eks_log_group_name="/aws/eks/${eks_cluster_name}/cluster"

          import_iam_role() {
            local address="$1"
            local name="$2"

            if ! terraform state list | grep -Fxq "${address}"; then
              if aws iam get-role --role-name "${name}" >/dev/null 2>&1; then
                terraform import -input=false "${address}" "${name}"
              fi
            fi
          }

          import_resource() {
            local address="$1"
            local id="$2"

            if ! terraform state list | grep -Fxq "${address}"; then
              terraform import -input=false "${address}" "${id}"
            fi
          }

          if ! terraform state list | grep -Fxq "${oidc_provider_address}"; then
            oidc_provider_arn="$(aws iam list-open-id-connect-providers \
              --query "OpenIDConnectProviderList[?contains(Arn, 'token.actions.githubusercontent.com')].Arn | [0]" \
              --output text)"

            if [[ -n "${oidc_provider_arn}" && "${oidc_provider_arn}" != "None" ]]; then
              terraform import -input=false "${oidc_provider_address}" "${oidc_provider_arn}"
            fi
          fi

          import_iam_role "aws_iam_role.github_actions_terraform" "GitHubActionsTerraform-20260903"
          import_iam_role "aws_iam_role.github_actions_eks" "GitHubActionsEKSDeploy-20260903"
          import_iam_role "aws_iam_role.eks_cluster" "eks-20260901-cluster"
          import_iam_role "aws_iam_role.eks_node" "eks-20260901-node"

          eks_node_group_name="eks-20260901-default"
          if aws eks describe-nodegroup \
            --cluster-name "${eks_cluster_name}" \
            --nodegroup-name "${eks_node_group_name}" >/dev/null 2>&1; then
            import_resource \
              "aws_eks_node_group.default" \
              "${eks_cluster_name}:${eks_node_group_name}"
          fi

          import_eks_addon() {
            local address="$1"
            local addon_name="$2"

            if aws eks describe-addon \
              --cluster-name "${eks_cluster_name}" \
              --addon-name "${addon_name}" >/dev/null 2>&1; then
              import_resource "${address}" "${eks_cluster_name}:${addon_name}"
            fi
          }

          import_eks_addon "aws_eks_addon.vpc_cni" "vpc-cni"
          import_eks_addon "aws_eks_addon.coredns" "coredns"
          import_eks_addon "aws_eks_addon.kube_proxy" "kube-proxy"

          eks_vpc_id="$(aws ec2 describe-vpcs \
            --filters \
              "Name=tag:Name,Values=eks-20260901-vpc" \
              "Name=cidr-block,Values=10.40.0.0/16" \
            --query 'Vpcs[0].VpcId' \
            --output text)"

          if [[ -n "${eks_vpc_id}" && "${eks_vpc_id}" != "None" ]]; then
            echo "Importing existing EKS VPC ${eks_vpc_id} and its network resources..."
            import_resource "aws_vpc.eks" "${eks_vpc_id}"
            import_resource "aws_eks_cluster.this" "${eks_cluster_name}"

            eks_internet_gateway_id="$(aws ec2 describe-internet-gateways \
              --filters "Name=attachment.vpc-id,Values=${eks_vpc_id}" \
              --query 'InternetGateways[0].InternetGatewayId' \
              --output text)"
            if [[ -n "${eks_internet_gateway_id}" && "${eks_internet_gateway_id}" != "None" ]]; then
              import_resource "aws_internet_gateway.eks" "${eks_internet_gateway_id}"
            fi

            read -r -a eks_private_subnet_ids <<< "$(aws ec2 describe-subnets \
              --filters \
                "Name=vpc-id,Values=${eks_vpc_id}" \
                "Name=tag:kubernetes.io/role/internal-elb,Values=1" \
              --query 'sort_by(Subnets, &AvailabilityZone)[].SubnetId' \
              --output text)"

            for index in "${!eks_private_subnet_ids[@]}"; do
              import_resource \
                "aws_subnet.eks_private[${index}]" \
                "${eks_private_subnet_ids[${index}]}"
            done

            read -r -a eks_public_subnet_ids <<< "$(aws ec2 describe-subnets \
              --filters \
                "Name=vpc-id,Values=${eks_vpc_id}" \
                "Name=tag:kubernetes.io/role/elb,Values=1" \
              --query 'sort_by(Subnets, &AvailabilityZone)[].SubnetId' \
              --output text)"

            for index in "${!eks_public_subnet_ids[@]}"; do
              import_resource \
                "aws_subnet.eks_public[${index}]" \
                "${eks_public_subnet_ids[${index}]}"
            done

            eks_public_route_table_id="$(aws ec2 describe-route-tables \
              --filters \
                "Name=vpc-id,Values=${eks_vpc_id}" \
                "Name=tag:Name,Values=eks-20260901-public" \
              --query 'RouteTables[0].RouteTableId' \
              --output text)"
            if [[ -n "${eks_public_route_table_id}" && "${eks_public_route_table_id}" != "None" ]]; then
              import_resource "aws_route_table.eks_public" "${eks_public_route_table_id}"
            fi

            eks_private_route_table_id="$(aws ec2 describe-route-tables \
              --filters \
                "Name=vpc-id,Values=${eks_vpc_id}" \
                "Name=tag:Name,Values=eks-20260901-private" \
              --query 'RouteTables[0].RouteTableId' \
              --output text)"
            if [[ -n "${eks_private_route_table_id}" && "${eks_private_route_table_id}" != "None" ]]; then
              import_resource "aws_route_table.eks_private" "${eks_private_route_table_id}"
            fi

            eks_nat_gateway_id="$(aws ec2 describe-nat-gateways \
              --filter \
                "Name=vpc-id,Values=${eks_vpc_id}" \
                "Name=tag:Name,Values=eks-20260901-nat" \
              --query 'NatGateways[?State==`available`].NatGatewayId | [0]' \
              --output text)"
            if [[ -n "${eks_nat_gateway_id}" && "${eks_nat_gateway_id}" != "None" ]]; then
              import_resource "aws_nat_gateway.eks" "${eks_nat_gateway_id}"

              eks_nat_eip_allocation_id="$(aws ec2 describe-nat-gateways \
                --nat-gateway-ids "${eks_nat_gateway_id}" \
                --query 'NatGateways[0].NatGatewayAddresses[0].AllocationId' \
                --output text)"
              if [[ -n "${eks_nat_eip_allocation_id}" && "${eks_nat_eip_allocation_id}" != "None" ]]; then
                import_resource "aws_eip.eks_nat" "${eks_nat_eip_allocation_id}"
              fi
            fi

            if [[ -n "${eks_public_route_table_id}" && "${eks_public_route_table_id}" != "None" ]]; then
              for index in "${!eks_public_subnet_ids[@]}"; do
                import_resource \
                  "aws_route_table_association.eks_public[${index}]" \
                  "${eks_public_subnet_ids[${index}]}/${eks_public_route_table_id}"
              done
            fi

            if [[ -n "${eks_private_route_table_id}" && "${eks_private_route_table_id}" != "None" ]]; then
              for index in "${!eks_private_subnet_ids[@]}"; do
                import_resource \
                  "aws_route_table_association.eks_private[${index}]" \
                  "${eks_private_subnet_ids[${index}]}/${eks_private_route_table_id}"
              done
            fi
          fi

          terraform_role_arn="$(aws iam get-role \
            --role-name "GitHubActionsTerraform-20260903" \
            --query 'Role.Arn' \
            --output text)"
          terraform_access_entry_address="aws_eks_access_entry.github_actions_terraform"
          terraform_access_entry_id="${eks_cluster_name}:${terraform_role_arn}"
          terraform_access_policy_address="aws_eks_access_policy_association.github_actions_terraform_cluster_admin"
          terraform_access_policy_arn="arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"

          if ! terraform state list | grep -Fxq "${terraform_access_entry_address}"; then
            if aws eks describe-access-entry \
              --cluster-name "${eks_cluster_name}" \
              --principal-arn "${terraform_role_arn}" >/dev/null 2>&1; then
              terraform import -input=false \
                "${terraform_access_entry_address}" \
                "${terraform_access_entry_id}"
            fi
          fi

          if ! terraform state list | grep -Fxq "${terraform_access_policy_address}"; then
            existing_access_policy="$(aws eks list-associated-access-policies \
              --cluster-name "${eks_cluster_name}" \
              --principal-arn "${terraform_role_arn}" \
              --query "associatedAccessPolicies[?policyArn=='${terraform_access_policy_arn}'].policyArn | [0]" \
              --output text)"

            if [[ "${existing_access_policy}" == "${terraform_access_policy_arn}" ]]; then
              terraform import -input=false \
                "${terraform_access_policy_address}" \
                "${eks_cluster_name}#${terraform_role_arn}#${terraform_access_policy_arn}"
            fi
          fi

          if ! terraform state list | grep -Fxq "${eks_log_group_address}"; then
            existing_log_group="$(aws logs describe-log-groups \
              --log-group-name-prefix "${eks_log_group_name}" \
              --query "logGroups[?logGroupName=='${eks_log_group_name}'].logGroupName | [0]" \
              --output text)"

            if [[ "${existing_log_group}" == "${eks_log_group_name}" ]]; then
              terraform import -input=false "${eks_log_group_address}" "${eks_log_group_name}"
            fi
          fi

      - name: Configure kubeconfig for Terraform destroy
        if: ${{ inputs.operation == 'destroy' }}
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Terraform destroy
        if: ${{ inputs.operation == 'destroy' }}
        run: |
          terraform plan -destroy -input=false -lock-timeout=5m -out=tfplan-destroy
          terraform apply -input=false -auto-approve tfplan-destroy

      - name: Terraform plan
        if: ${{ inputs.operation == 'plan' }}
        run: |
          terraform plan -input=false -lock-timeout=5m \
            -target=aws_route_table_association.eks_public \
            -target=aws_route_table_association.eks_private \
            -target=aws_eks_node_group.default \
            -target=aws_eks_addon.vpc_cni \
            -target=aws_eks_addon.coredns \
            -target=aws_eks_addon.kube_proxy \
            -target=aws_eks_access_policy_association.github_actions_terraform_cluster_admin \
            -out=tfplan

      - name: Remove failed EKS node group
        if: ${{ inputs.operation == 'apply' }}
        shell: bash
        run: |
          eks_cluster_name="eks-cluster-20260903"
          node_group_name="eks-20260901-default"
          node_group_status="$(aws eks describe-nodegroup \
            --region "${{ vars.AWS_REGION }}" \
            --cluster-name "${eks_cluster_name}" \
            --nodegroup-name "${node_group_name}" \
            --query 'nodegroup.status' \
            --output text 2>/dev/null || true)"

          if [[ "${node_group_status}" == "CREATE_FAILED" ]]; then
            echo "Deleting failed node group ${node_group_name}..."
            aws eks delete-nodegroup \
              --region "${{ vars.AWS_REGION }}" \
              --cluster-name "${eks_cluster_name}" \
              --nodegroup-name "${node_group_name}"
            aws eks wait nodegroup-deleted \
              --region "${{ vars.AWS_REGION }}" \
              --cluster-name "${eks_cluster_name}" \
              --nodegroup-name "${node_group_name}"
          else
            echo "No failed node group to delete (status: ${node_group_status:-not found})."
          fi

      - name: Terraform apply EKS foundation
        if: ${{ inputs.operation == 'apply' }}
        run: |
          terraform plan -input=false -lock-timeout=5m \
            -target=aws_route_table_association.eks_public \
            -target=aws_route_table_association.eks_private \
            -target=aws_eks_node_group.default \
            -target=aws_eks_addon.vpc_cni \
            -target=aws_eks_addon.coredns \
            -target=aws_eks_addon.kube_proxy \
            -target=aws_eks_access_policy_association.github_actions_terraform_cluster_admin \
            -out=tfplan-foundation
          terraform apply -input=false -auto-approve tfplan-foundation

      - name: Configure kubeconfig for Helm
        if: ${{ inputs.operation == 'apply' }}
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Import existing Argo CD Helm releases
        if: ${{ inputs.operation == 'apply' }}
        shell: bash
        run: |
          helm_namespace="argocd"

          import_helm_release() {
            local address="$1"
            local release_name="$2"

            if ! terraform state list | grep -Fxq "${address}"; then
              if kubectl get secret \
                --namespace "${helm_namespace}" \
                --selector "owner=helm,name=${release_name}" \
                --no-headers 2>/dev/null | grep -q .; then
                terraform import -input=false \
                  "${address}" \
                  "${helm_namespace}/${release_name}"
              fi
            fi
          }

          import_helm_release "helm_release.argocd" "argocd"
          import_helm_release "helm_release.argocd_application" "argocd-application"

      - name: Terraform install Argo CD
        if: ${{ inputs.operation == 'apply' }}
        run: |
          terraform plan -input=false -lock-timeout=5m \
            -target=helm_release.argocd_application \
            -out=tfplan-argocd
          terraform apply -input=false -auto-approve tfplan-argocd
