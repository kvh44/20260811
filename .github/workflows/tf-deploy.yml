name: Terraform infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation to run.
        required: true
        default: plan
        type: choice
        options:
          - init
          - plan
          - apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-infrastructure
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ inputs.operation }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .terraform
    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActionsTerraform

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Import existing GitHub Actions IAM resources
        shell: bash
        run: |
          oidc_provider_address="aws_iam_openid_connect_provider.github_actions"
          terraform_role_address="aws_iam_role.github_actions_terraform"
          terraform_role_name="GitHubActionsTerraform-20260903"

          if ! terraform state list | grep -Fxq "${oidc_provider_address}"; then
            oidc_provider_arn="$(aws iam list-open-id-connect-providers \
              --query "OpenIDConnectProviderList[?contains(Arn, 'token.actions.githubusercontent.com')].Arn | [0]" \
              --output text)"

            if [[ -n "${oidc_provider_arn}" && "${oidc_provider_arn}" != "None" ]]; then
              terraform import -input=false "${oidc_provider_address}" "${oidc_provider_arn}"
            fi
          fi

          if ! terraform state list | grep -Fxq "${terraform_role_address}"; then
            if aws iam get-role --role-name "${terraform_role_name}" >/dev/null 2>&1; then
              terraform import -input=false "${terraform_role_address}" "${terraform_role_name}"
            fi
          fi

      - name: Terraform plan
        if: ${{ inputs.operation == 'plan' }}
        run: |
          ../bootstrap-github-actions-terraform-role.sh
          terraform plan -input=false -lock-timeout=5m \
            -target=aws_eks_addon.vpc_cni \
            -target=aws_eks_addon.coredns \
            -target=aws_eks_addon.kube_proxy \
            -target=aws_eks_access_policy_association.github_actions_terraform_cluster_admin \
            -out=tfplan
      - name: Terraform apply EKS foundation
        if: ${{ inputs.operation == 'apply' }}
        run: |
          ../bootstrap-github-actions-terraform-role.sh
          terraform plan -input=false -lock-timeout=5m \
            -target=aws_eks_addon.vpc_cni \
            -target=aws_eks_addon.coredns \
            -target=aws_eks_addon.kube_proxy \
            -target=aws_eks_access_policy_association.github_actions_terraform_cluster_admin \
            -out=tfplan-foundation
          terraform apply -input=false -auto-approve tfplan-foundation

      - name: Configure kubeconfig for Helm
        if: ${{ inputs.operation == 'apply' }}
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Terraform install Argo CD
        if: ${{ inputs.operation == 'apply' }}
        run: |
          terraform plan -input=false -lock-timeout=5m -out=tfplan-argocd
          terraform apply -input=false -auto-approve tfplan-argocd
