apiVersion: apps/v1
kind: Deployment
metadata:
  name: 20260819
  labels:
    app: 20260819
spec:
  replicas: 2
  selector:
    matchLabels:
      app: 20260819
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: 20260819
    spec:
      restartPolicy: Always
      containers:
      - name: 20260819
        # Replace the image below with your application's image (e.g. myrepo/myimage:tag)
        image: nginx:stable
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
