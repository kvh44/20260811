AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions OIDC role for deploying kvh44/20260811 to Amazon EKS

Parameters:
  GitHubOwner:
    Type: String
    Default: kvh44
  GitHubOwnerId:
    Type: String
    Default: '16013107'
  GitHubRepository:
    Type: String
    Default: '20260811'
  GitHubRepositoryId:
    Type: String
    Default: '1331272653'
  GitHubBranch:
    Type: String
    Default: main
  EcrRepositoryName:
    Type: String
    Default: test
  EksClusterName:
    Type: String
    Default: eks-cluster-20260903
  EcsClusterName:
    Type: String
    Default: app-20260901-cluster
  EcsServiceName:
    Type: String
    Default: app-20260901-service
  KubernetesNamespace:
    Type: String
    Default: default
  RoleName:
    Type: String
    Default: GitHubActionsEKSDeploy-20260903

Resources:
  GitHubActionsOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Repository
          Value: !Sub ${GitHubOwner}/${GitHubRepository}

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Allows the main branch of kvh44/20260811 to deploy to ECR and EKS
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubActionsOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepository}@${GitHubRepositoryId}:ref:refs/heads/${GitHubBranch}
      Policies:
        - PolicyName: DeployAndScaleContainerWorkloads
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: GetEcrAuthorizationToken
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: PushImageToRepository
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryName}
              - Sid: DescribeEksCluster
                Effect: Allow
                Action: eks:DescribeCluster
                Resource: !Sub arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${EksClusterName}
              - Sid: ScaleEcsService
                Effect: Allow
                Action: ecs:UpdateService
                Resource: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${EcsClusterName}/${EcsServiceName}
      Tags:
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Repository
          Value: !Sub ${GitHubOwner}/${GitHubRepository}

  GitHubActionsEksAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref EksClusterName
      PrincipalArn: !GetAtt GitHubActionsDeployRole.Arn
      Type: STANDARD
      AccessPolicies:
        # bootstrap-argocd.sh installs CRDs, ClusterRoles, and ClusterRoleBindings.
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope:
            Type: cluster
      Tags:
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Repository
          Value: !Sub ${GitHubOwner}/${GitHubRepository}

Outputs:
  AwsRoleToAssume:
    Description: Set this ARN as the GitHub Actions repository variable AWS_ROLE_TO_ASSUME
    Value: !GetAtt GitHubActionsDeployRole.Arn
